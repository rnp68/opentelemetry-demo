#
# Helm values for the grafana/k8s-monitoring chart (v4.x).
# Generated by the Grafana Cloud "Kubernetes Infrastructure" wizard, then
# cleaned up: trailing dots stripped from URLs, secrets removed (passwords
# are injected by the install script via --set-string).
#
# Edit instance IDs / endpoints below to match your Grafana Cloud stack —
# find them at: https://grafana.com/orgs/<org>/stacks → "Send Data" page
# for each backend.
#
# Cluster name is set by the install script via --set-string; do not hardcode
# here, otherwise local + AWS clusters collide in Grafana Cloud.

destinations:
  grafana-cloud-metrics:
    type: prometheus
    url: https://prometheus-prod-13-prod-us-east-0.grafana.net/api/prom/push
    auth:
      type: basic
      username: "1789283"

  grafana-cloud-logs:
    type: loki
    url: https://logs-prod-006.grafana.net/loki/api/v1/push
    auth:
      type: basic
      username: "993928"

  gc-otlp-endpoint:
    type: otlp
    url: https://otlp-gateway-prod-us-east-0.grafana.net/otlp
    protocol: http
    auth:
      type: basic
      username: "1036148"
    metrics:
      enabled: true
    logs:
      enabled: true
    traces:
      enabled: true

  grafana-cloud-profiles:
    type: pyroscope
    url: https://profiles-prod-001.grafana.net:443
    auth:
      type: basic
      username: "1036148"

clusterMetrics:
  enabled: true
  collector: alloy-metrics

hostMetrics:
  enabled: true
  collector: alloy-metrics
  linuxHosts:
    enabled: true
  windowsHosts:
    enabled: true
  energyMetrics:
    enabled: true

costMetrics:
  enabled: true
  collector: alloy-metrics

clusterEvents:
  enabled: true
  collector: alloy-singleton

podLogsViaLoki:
  enabled: true
  collector: alloy-logs

applicationObservability:
  enabled: true
  collector: alloy-receiver
  receivers:
    otlp:
      grpc:
        enabled: true
        port: 4317
      http:
        enabled: true
        port: 4318
    zipkin:
      enabled: true
      port: 9411

autoInstrumentation:
  enabled: true
  collector: alloy-metrics
  beyla:
    deliverTracesToApplicationObservability: false

profiling:
  enabled: true
  collector: alloy-profiles

collectors:
  alloy-metrics:
    presets:
      - clustered
      - statefulset
  alloy-singleton:
    presets:
      - singleton
  alloy-logs:
    presets:
      - filesystem-log-reader
      - daemonset
  alloy-receiver:
    presets:
      - deployment
  alloy-profiles:
    presets:
      - privileged
      - daemonset

collectorCommon:
  alloy:
    remoteConfig:
      # Disabled: the access policy token needs fleet-management:read/write scopes.
      # To re-enable: add those scopes at grafana.com/orgs/ramironagles/access-policies,
      # create a new token, update ~/.grafana-cloud-token, and set enabled: true.
      enabled: false

telemetryServices:
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true
  windows-exporter:
    deploy: true
  opencost:
    deploy: true
    metricsSource: grafana-cloud-metrics
    opencost:
      exporter: {}  # defaultClusterId set by install script via --set-string
      prometheus:
        # existingSecretName is set by install script via --set-string —
        # auto-tracks release name as: <destination-name>-<release-name>
        # (e.g. grafana-cloud-metrics-grafana-k8s-monitoring)
        external:
          url: https://prometheus-prod-13-prod-us-east-0.grafana.net/api/prom
  kepler:
    deploy: true
