apiVersion: slo.ext.grafana.app/v1alpha1
kind: SLO
metadata:
  name: ib8ztiuzl4u9uymj60rw0
spec:
  name: Browse Products Availability
  description: HTTP success rate for product catalog browsing
  labels:
    - key: team
      value: platform
    - key: app
      value: otel-demo
  objectives:
    - value: 0.999
      window: 28d
  destinationDatasource:
    uid: grafanacloud-prom
  query:
    type: freeform
    freeform:
      query: sum(rate(http_server_duration_count{http_route=~"/api/products.*",http_status_code!~"5.."}[$__rate_interval])) / sum(rate(http_server_duration_count{http_route=~"/api/products.*"}[$__rate_interval]))
