apiVersion: synthetic-monitoring.grafana.com/v1alpha1
kind: Check
metadata:
  name: otel-demo-cart
spec:
  job: otel-demo-cart
  target: http://MINIKUBE_IP:8080/api/cart
  frequency: 60000
  timeout: 10000
  enabled: true
  labels:
    app: otel-demo
    env: minikube
  settings:
    http:
      validStatusCodes:
        - 200
      validHTTPVersions:
        - HTTP/1.1
        - HTTP/2.0
      failIfNotSSL: false
      method: GET
