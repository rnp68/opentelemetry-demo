#
# SLO template. scripts/render-assets.sh substitutes ${...} placeholders from
# .env.local and writes the result to build/grafana-assets/slo/.
# VERIFY BEFORE RELYING ON IT: the PromQL below depends on the metric names your
# Grafana Cloud stack ends up with (they vary with SDK and semantic-convention
# versions). Run the query in Explore first; docs/grafana-assets.md explains how.
apiVersion: slo.ext.grafana.app/v1alpha1
kind: SLO
metadata:
  name: fh9i9i8jx3ciek89sffti
spec:
  name: Recommendation Availability
  description: HTTP success rate for recommendation service
  labels:
    - key: team
      value: platform
    - key: app
      value: otel-demo
    - key: env
      value: ${DEMO_ENVIRONMENT}
  objectives:
    - value: 0.999
      window: 28d
  destinationDatasource:
    uid: ${GRAFANA_CLOUD_PROM_DATASOURCE_UID}
  query:
    type: freeform
    freeform:
      query: sum(rate(rpc_server_duration_count{rpc_service=~".*Recommendation.*",rpc_grpc_status_code="0"}[$__rate_interval])) / sum(rate(rpc_server_duration_count{rpc_service=~".*Recommendation.*"}[$__rate_interval]))
