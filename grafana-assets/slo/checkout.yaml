#
# SLO template. scripts/render-assets.sh substitutes ${...} placeholders from
# .env.local and writes the result to build/grafana-assets/slo/.
# The query uses the collector's span metrics (traces_span_metrics_calls_total,
# produced by the spanmetrics connector in the collector configs of this branch).
# Checked against a live stack running this branch (demo 2.0.2, Grafana Cloud OTLP):
# the SDK metrics http_server_duration_count and rpc_server_duration_count that the
# original queries used do NOT exist there. The query returns no data until the
# route has received requests (the load generator sends some).
apiVersion: slo.ext.grafana.app/v1alpha1
kind: SLO
metadata:
  name: jam1zt9bmawgs3hore2gu
spec:
  name: Checkout Availability
  description: Share of checkout requests (POST /api/checkout) served by the frontend without an error
  labels:
    - key: team
      value: platform
    - key: app
      value: otel-demo
    - key: env
      value: ${DEMO_ENVIRONMENT}
  objectives:
    - value: 0.999
      window: 28d
  destinationDatasource:
    uid: ${GRAFANA_CLOUD_PROM_DATASOURCE_UID}
  query:
    type: freeform
    freeform:
      query: sum(rate(traces_span_metrics_calls_total{service_name="frontend",span_name=~"POST /api/checkout.*",status_code!="STATUS_CODE_ERROR"}[$__rate_interval])) / sum(rate(traces_span_metrics_calls_total{service_name="frontend",span_name=~"POST /api/checkout.*"}[$__rate_interval]))
