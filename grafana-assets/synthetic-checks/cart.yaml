#
# Synthetic Monitoring check template. scripts/render-assets.sh substitutes
# ${DEMO_TARGET_URL} (where Grafana Cloud's probes can reach the shop) and
# ${DEMO_ENVIRONMENT} from .env.local.
apiVersion: synthetic-monitoring.grafana.com/v1alpha1
kind: Check
metadata:
  name: otel-demo-cart
spec:
  job: otel-demo-cart
  target: ${DEMO_TARGET_URL}/api/cart?sessionId=synthetic-check&currencyCode=USD
  frequency: 60000
  timeout: 10000
  enabled: true
  labels:
    app: otel-demo
    env: ${DEMO_ENVIRONMENT}
  settings:
    http:
      validStatusCodes:
        - 200
      validHTTPVersions:
        - HTTP/1.1
        - HTTP/2.0
      failIfNotSSL: false
      method: GET
