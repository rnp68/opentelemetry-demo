#
# Synthetic Monitoring check template. scripts/render-assets.sh substitutes
# ${DEMO_TARGET_URL} (where Grafana Cloud's probes can reach the shop) and
# ${DEMO_ENVIRONMENT} from .env.local.
#
# Observed against a running stack (demo 2.0.2, smoke test 2026-11-09):
#   - the original body {"userId":"health-check"} returns HTTP 500 (no address,
#     card or currency), so a check that expects 200 would fail on every probe;
#   - a complete order body returns 200 even with an empty cart, but every
#     request records a real (empty) order and a Kafka event.
# So this check carries a complete body and is DISABLED by default; enable it
# (enabled: true) only if you accept one order per probe per minute.
apiVersion: synthetic-monitoring.grafana.com/v1alpha1
kind: Check
metadata:
  name: otel-demo-checkout
spec:
  job: otel-demo-checkout
  target: ${DEMO_TARGET_URL}/api/checkout?currencyCode=USD
  frequency: 60000
  timeout: 10000
  enabled: false
  labels:
    app: otel-demo
    env: ${DEMO_ENVIRONMENT}
  settings:
    http:
      validStatusCodes:
        - 200
      validHTTPVersions:
        - HTTP/1.1
        - HTTP/2.0
      failIfNotSSL: false
      method: POST
      body: '{"userId":"synthetic-check","email":"check@example.com","address":{"streetAddress":"1 Test St","city":"Testville","state":"CA","country":"US","zipCode":"12345"},"userCurrency":"USD","creditCard":{"creditCardNumber":"4432-8015-6152-0454","creditCardCvv":672,"creditCardExpirationYear":2030,"creditCardExpirationMonth":1}}'
      headers:
        - name: Content-Type
          values:
            - application/json
