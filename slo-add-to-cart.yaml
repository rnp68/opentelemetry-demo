apiVersion: slo.ext.grafana.app/v1alpha1
kind: SLO
metadata:
  name: rjw13gt9gn7ydws0mug8y
spec:
  name: Add to Cart Availability
  description: HTTP success rate for cart operations
  labels:
    - key: team
      value: platform
    - key: app
      value: otel-demo
  objectives:
    - value: 0.999
      window: 28d
  destinationDatasource:
    uid: grafanacloud-prom
  query:
    type: freeform
    freeform:
      query: sum(rate(http_server_duration_count{http_route=~"/api/cart.*",http_status_code!~"5.."}[$__rate_interval])) / sum(rate(http_server_duration_count{http_route=~"/api/cart.*"}[$__rate_interval]))
